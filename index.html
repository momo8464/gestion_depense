<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Gestionnaire de dépenses personnel">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Mes Dépenses</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <button class="icon-btn" id="prevMonth" aria-label="Mois précédent">‹</button>
    <h1 id="monthLabel"></h1>
    <button class="icon-btn" id="nextMonth" aria-label="Mois suivant">›</button>
  </header>

  <main>
    <section id="summary" class="card summary"></section>

    <!-- Onglet Opérations -->
    <section id="tab-list" class="tab">
      <div class="search">
        <input id="q" type="search" placeholder="🔍 Rechercher (note, catégorie, montant…)" aria-label="Rechercher une opération" autocomplete="off">
        <button id="filterBtn" class="icon-btn" aria-label="Filtres" aria-expanded="false" aria-controls="filters">⚙︎</button>
      </div>
      <div id="filters" class="card filters" hidden>
        <label class="field">Type
          <select id="flType">
            <option value="">Tous</option>
            <option value="expense">Dépenses</option>
            <option value="income">Revenus</option>
            <option value="transfer">Virements</option>
          </select>
        </label>
        <label class="field">Catégorie<select id="flCat"></select></label>
        <label class="field" id="flAccWrap">Compte<select id="flAcc"></select></label>
        <label class="field">Période
          <select id="flPeriod">
            <option value="month">Mois affiché</option>
            <option value="all">Toutes les périodes</option>
          </select>
        </label>
      </div>
      <div id="listBody"></div>
    </section>

    <section id="tab-stats" class="tab" hidden></section>
    <section id="tab-plus" class="tab" hidden></section>
    <section id="tab-settings" class="tab" hidden></section>
  </main>

  <button id="fab" class="fab" aria-label="Ajouter une opération">+</button>

  <nav class="bottom">
    <button data-tab="list" class="active"><span aria-hidden="true">📋</span>Opérations</button>
    <button data-tab="stats"><span aria-hidden="true">📊</span>Statistiques</button>
    <button data-tab="plus"><span aria-hidden="true">🧰</span>Plus</button>
    <button data-tab="settings"><span aria-hidden="true">⚙️</span>Réglages</button>
  </nav>

  <!-- Formulaire d'ajout / modification -->
  <div id="backdrop" class="backdrop" hidden></div>
  <form id="sheet" class="sheet" hidden autocomplete="off">
    <div class="grab"></div>
    <h2 id="sheetTitle">Nouvelle opération</h2>
    <div class="seg">
      <button type="button" data-type="expense" class="active">Dépense</button>
      <button type="button" data-type="income">Revenu</button>
      <button type="button" data-type="transfer" id="segTransfer">Virement</button>
    </div>
    <div id="fFavs" class="favs" hidden></div>
    <label class="amount">
      <input id="fAmount" inputmode="decimal" placeholder="0" aria-label="Montant" required>
      <span id="fCurrency"></span>
    </label>
    <div id="fCats" class="cats" role="radiogroup" aria-label="Catégorie"></div>
    <div id="fTransfer" class="row2" hidden>
      <label class="field">Depuis<select id="fFrom"></select></label>
      <label class="field">Vers<select id="fTo"></select></label>
    </div>
    <label class="field" id="fAccountWrap">Compte<select id="fAccount"></select></label>
    <label class="field">Date<input type="date" id="fDate" required></label>
    <label class="field" id="fRepeatWrap">Répéter
      <select id="fRepeat">
        <option value="">Non, une seule fois</option>
        <option value="monthly">Chaque mois</option>
        <option value="weekly">Chaque semaine</option>
      </select>
      <small id="fRepeatHint" class="field-hint"></small>
    </label>
    <label class="field">Note<input id="fNote" maxlength="80" placeholder="Ex : courses du samedi"></label>
    <div id="fPhotoWrap" class="photo-field">
      <button type="button" id="fPhotoBtn" class="btn ghost">📷 Ajouter la photo du ticket</button>
      <div id="fPhotoPreview" class="photo-preview" hidden>
        <img id="fPhotoImg" alt="Photo du ticket (toucher pour agrandir)">
        <button type="button" id="fPhotoRemove" class="btn danger small">Retirer la photo</button>
      </div>
      <input type="file" id="fPhotoInput" accept="image/*" hidden>
    </div>
    <label class="check" id="fFavWrap"><input type="checkbox" id="fFav"> ⭐ Ajouter aux favoris</label>
    <div class="actions">
      <button type="button" id="fDelete" class="btn danger" hidden>Supprimer</button>
      <button type="button" id="fCancel" class="btn ghost">Annuler</button>
      <button type="submit" class="btn primary">Enregistrer</button>
    </div>
  </form>

  <!-- Fenêtre de saisie réutilisable (voir js/dialog.js) -->
  <div id="dlgBackdrop" class="backdrop dlg-backdrop" hidden></div>
  <form id="dlg" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" hidden autocomplete="off">
    <h2 id="dlgTitle"></h2>
    <p id="dlgText" class="hint"></p>
    <div id="dlgFields"></div>
    <div class="actions">
      <button type="button" id="dlgCancel" class="btn ghost">Annuler</button>
      <button type="submit" id="dlgOk" class="btn primary">Valider</button>
    </div>
  </form>

  <!-- Photo du ticket en grand -->
  <div id="photoView" class="photo-view" hidden>
    <img id="photoViewImg" alt="Photo du ticket">
    <button type="button" id="photoClose" class="btn ghost">Fermer</button>
  </div>

  <!-- Écran du code PIN -->
  <div id="lock" class="lock" hidden>
    <div class="lock-box">
      <div class="lock-icon" aria-hidden="true">🔒</div>
      <h2 id="lockTitle">Entre ton code PIN</h2>
      <p id="lockMsg" class="lock-msg" aria-live="polite"></p>
      <div id="lockDots" class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="keypad" id="keypad">
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <span></span>
        <button type="button" data-key="0">0</button>
        <button type="button" data-key="del" class="ghost-key" aria-label="Effacer">⌫</button>
      </div>
      <button type="button" id="lockAlt" class="link-btn"></button>
    </div>
  </div>

  <!-- Proposition d'installation -->
  <div id="installBackdrop" class="backdrop install-backdrop" hidden></div>
  <div id="install" class="install-card" role="dialog" aria-modal="true" aria-labelledby="installTitle" hidden>
    <img src="icons/icon-192.png" alt="" width="64" height="64">
    <h2 id="installTitle">Installe Mes Dépenses</h2>
    <p>Ajoute l'application à ton écran d'accueil : elle s'ouvre en plein écran et fonctionne même sans Internet.</p>
    <p id="installHow" class="install-how" hidden></p>
    <div class="install-actions">
      <button type="button" id="installBtn" class="btn primary">📲 Installer l'application</button>
      <button type="button" id="installLater" class="btn ghost">Continuer dans le navigateur</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <!-- Relevé imprimable (rempli au moment d'imprimer) -->
  <div id="print"></div>

  <!-- Le code est découpé par fonctionnalité ; l'ordre de chargement compte -->
  <script src="js/core.js"></script>
  <script src="js/dialog.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/recurring.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/list.js"></script>
  <script src="js/form.js"></script>
  <script src="js/plus.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/security.js"></script>
  <script src="js/install.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
