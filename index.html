<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Gestionnaire de dépenses personnel">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Mes Dépenses</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <button class="icon-btn" id="prevMonth" aria-label="Mois précédent">‹</button>
    <h1 id="monthLabel"></h1>
    <button class="icon-btn" id="nextMonth" aria-label="Mois suivant">›</button>
  </header>

  <main>
    <section id="summary" class="card summary"></section>
    <section id="tab-list" class="tab"></section>
    <section id="tab-stats" class="tab" hidden></section>
    <section id="tab-settings" class="tab" hidden></section>
  </main>

  <button id="fab" class="fab" aria-label="Ajouter une opération">+</button>

  <nav class="bottom">
    <button data-tab="list" class="active"><span aria-hidden="true">📋</span>Opérations</button>
    <button data-tab="stats"><span aria-hidden="true">📊</span>Statistiques</button>
    <button data-tab="settings"><span aria-hidden="true">⚙️</span>Réglages</button>
  </nav>

  <div id="backdrop" class="backdrop" hidden></div>

  <form id="sheet" class="sheet" hidden autocomplete="off">
    <div class="grab"></div>
    <h2 id="sheetTitle">Nouvelle opération</h2>
    <div class="seg">
      <button type="button" data-type="expense" class="active">Dépense</button>
      <button type="button" data-type="income">Revenu</button>
    </div>
    <label class="amount">
      <input id="fAmount" inputmode="decimal" placeholder="0" aria-label="Montant" required>
      <span id="fCurrency"></span>
    </label>
    <div id="fCats" class="cats" role="radiogroup" aria-label="Catégorie"></div>
    <label class="field">Date<input type="date" id="fDate" required></label>
    <label class="field">Note<input id="fNote" maxlength="80" placeholder="Ex : courses du samedi"></label>
    <div class="actions">
      <button type="button" id="fDelete" class="btn danger" hidden>Supprimer</button>
      <button type="button" id="fCancel" class="btn ghost">Annuler</button>
      <button type="submit" class="btn primary">Enregistrer</button>
    </div>
  </form>

  <div id="toast" class="toast" hidden></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="app.js"></script>
</body>
</html>
